name: Release plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          ./gradlew clean jar -Pversion="${VERSION}"
          test -s "build/libs/agonessync-${VERSION}.jar"
          unzip -p "build/libs/agonessync-${VERSION}.jar" plugin.yml | grep -F "version: '${VERSION}'"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "build/libs/agonessync-${VERSION}.jar" \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
